openapi: 3.0.3
info:
  title: Checkers Game API
  description: REST API for checkers multiplayer game
  version: 1.0.0
  contact:
    name: API Support

servers:
  - url: http://localhost:3000/api
    description: Development server
  - url: https://checkers-game.vercel.app/api
    description: Production server

tags:
  - name: auth
    description: Authentication endpoints
  - name: games
    description: Game management
  - name: rooms
    description: Online game rooms
  - name: players
    description: Player profiles and statistics

paths:
  # ==================== AUTH ====================
  /auth/register:
    post:
      tags: [auth]
      summary: Register new player account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, username]
              properties:
                email:
                  type: string
                  format: email
                  example: player@example.com
                password:
                  type: string
                  minLength: 8
                  example: SecurePass123!
                username:
                  type: string
                  minLength: 3
                  maxLength: 20
                  example: CheckersChamp
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email or username already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [auth]
      summary: Login to existing account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags: [auth]
      summary: Logout current session
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out successfully

  # ==================== GAMES ====================
  /games:
    post:
      tags: [games]
      summary: Create new game
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [LOCAL, ONLINE, BOT]
                botDifficulty:
                  type: string
                  enum: [EASY, MEDIUM, HARD]
                  description: Required if type is BOT
      responses:
        '201':
          description: Game created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    get:
      tags: [games]
      summary: List games (active, finished, or all)
      security:
        - sessionAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [WAITING, IN_PROGRESS, FINISHED, ABANDONED]
        - name: type
          in: query
          schema:
            type: string
            enum: [LOCAL, ONLINE, BOT]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of games
          content:
            application/json:
              schema:
                type: object
                properties:
                  games:
                    type: array
                    items:
                      $ref: '#/components/schemas/GameSummary'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer

  /games/{gameId}:
    get:
      tags: [games]
      summary: Get game details
      security:
        - sessionAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Game details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetailed'
        '404':
          $ref: '#/components/responses/NotFound'

  /games/{gameId}/move:
    post:
      tags: [games]
      summary: Make a move
      security:
        - sessionAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveRequest'
      responses:
        '200':
          description: Move executed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  move:
                    $ref: '#/components/schemas/Move'
                  game:
                    $ref: '#/components/schemas/Game'
        '400':
          description: Invalid move
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid move - piece cannot move there
                  validMoves:
                    type: array
                    items:
                      $ref: '#/components/schemas/Position'
        '403':
          description: Not your turn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /games/{gameId}/resign:
    post:
      tags: [games]
      summary: Resign from game
      security:
        - sessionAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Game resigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'

  # ==================== ROOMS ====================
  /rooms:
    post:
      tags: [rooms]
      summary: Create online game room
      security:
        - sessionAuth: []
      responses:
        '201':
          description: Room created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /rooms/{code}/join:
    post:
      tags: [rooms]
      summary: Join room by code
      security:
        - sessionAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Z0-9]{6}$'
            example: ABC123
      responses:
        '200':
          description: Joined room successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  room:
                    $ref: '#/components/schemas/Room'
                  game:
                    $ref: '#/components/schemas/Game'
        '404':
          description: Room not found or expired
        '409':
          description: Room is full

  /rooms/{code}:
    get:
      tags: [rooms]
      summary: Get room details
      security:
        - sessionAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Z0-9]{6}$'
      responses:
        '200':
          description: Room details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================== PLAYERS ====================
  /players/me:
    get:
      tags: [players]
      summary: Get current player profile
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Player profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /players/me/stats:
    get:
      tags: [players]
      summary: Get player statistics
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Player statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerStats'

  /players/me/history:
    get:
      tags: [players]
      summary: Get game history
      security:
        - sessionAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Game history
          content:
            application/json:
              schema:
                type: object
                properties:
                  games:
                    type: array
                    items:
                      $ref: '#/components/schemas/GameSummary'

# ==================== COMPONENTS ====================
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token

  schemas:
    AuthResponse:
      type: object
      properties:
        player:
          $ref: '#/components/schemas/Player'
        session:
          type: object
          properties:
            expires:
              type: string
              format: date-time

    Player:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
        createdAt:
          type: string
          format: date-time
        totalGames:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        draws:
          type: integer

    PlayerStats:
      type: object
      properties:
        totalGames:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        draws:
          type: integer
        winRate:
          type: number
          format: float
          example: 0.65
        gamesThisWeek:
          type: integer
        currentStreak:
          type: integer
          description: Current win/loss streak

    Game:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [LOCAL, ONLINE, BOT]
        status:
          type: string
          enum: [WAITING, IN_PROGRESS, FINISHED, ABANDONED]
        result:
          type: string
          enum: [WHITE_WIN, BLACK_WIN, DRAW]
          nullable: true
        boardState:
          $ref: '#/components/schemas/BoardState'
        currentTurn:
          type: string
          enum: [WHITE, BLACK]
        whitePlayerId:
          type: string
          format: uuid
          nullable: true
        blackPlayerId:
          type: string
          format: uuid
          nullable: true
        botDifficulty:
          type: string
          enum: [EASY, MEDIUM, HARD]
          nullable: true
        moveCount:
          type: integer
        lastMoveAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    GameSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        status:
          type: string
        result:
          type: string
          nullable: true
        whitePlayer:
          type: object
          properties:
            username:
              type: string
        blackPlayer:
          type: object
          properties:
            username:
              type: string
        createdAt:
          type: string
          format: date-time

    GameDetailed:
      allOf:
        - $ref: '#/components/schemas/Game'
        - type: object
          properties:
            moves:
              type: array
              items:
                $ref: '#/components/schemas/Move'
            whitePlayer:
              $ref: '#/components/schemas/Player'
            blackPlayer:
              $ref: '#/components/schemas/Player'

    BoardState:
      type: object
      properties:
        pieces:
          type: array
          items:
            $ref: '#/components/schemas/Piece'
        capturedPieces:
          type: object
          properties:
            white:
              type: integer
            black:
              type: integer
        positionHistory:
          type: array
          items:
            type: string
          description: Hash history for draw detection

    Piece:
      type: object
      properties:
        id:
          type: string
        color:
          type: string
          enum: [WHITE, BLACK]
        type:
          type: string
          enum: [MAN, KING]
        row:
          type: integer
          minimum: 0
          maximum: 7
        col:
          type: integer
          minimum: 0
          maximum: 7

    Position:
      type: object
      properties:
        row:
          type: integer
          minimum: 0
          maximum: 7
        col:
          type: integer
          minimum: 0
          maximum: 7

    MoveRequest:
      type: object
      required: [pieceId, toRow, toCol]
      properties:
        pieceId:
          type: string
        toRow:
          type: integer
          minimum: 0
          maximum: 7
        toCol:
          type: integer
          minimum: 0
          maximum: 7

    Move:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sequenceNumber:
          type: integer
        color:
          type: string
          enum: [WHITE, BLACK]
        pieceId:
          type: string
        fromRow:
          type: integer
        fromCol:
          type: integer
        toRow:
          type: integer
        toCol:
          type: integer
        capturedPieces:
          type: array
          items:
            $ref: '#/components/schemas/Position'
        wasPromotion:
          type: boolean
        timestamp:
          type: string
          format: date-time

    Room:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^[A-Z0-9]{6}$'
          example: ABC123
        gameId:
          type: string
          format: uuid
        status:
          type: string
          enum: [WAITING, ACTIVE, FINISHED]
        hostPlayerId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

  responses:
    BadRequest:
      description: Bad request - validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Unauthorized - authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
